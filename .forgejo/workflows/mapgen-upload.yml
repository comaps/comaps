name: mapgen-upload
on:
  workflow_dispatch: # Manual trigger
    inputs:
      new_series_version:
        description: 'Map series and version to upload, i.e. 2026.06.28/260714'
        required: true
      remove_3:
        description: 'Series/version to remove from 3-version CDNs (fi1 ru1), i.e. 2026.06.28/260628, or none'
        required: true
      remove_6:
        description: 'Series/version to remove from 6-version CDNs (us2 de1 fr1 it1), i.e. 2026.04.05/260617, or none'
        required: true

env:
  COUNTRIES_PUB_KEY: ${{ secrets.COUNTRIES_PUB_KEY }}
  # RCLONE_CONF is multi-line text containing keys and credentials for CDN nodes
  RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
  ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
  NEW_SERIES_VERSION: ${{ inputs.new_series_version }}
  REMOVE_3: ${{ inputs.remove_3 }}
  REMOVE_6: ${{ inputs.remove_6 }}

jobs:
  upload-maps:
    name: Upload maps to CDN nodes
    runs-on: mapfilemaker
    container:
      image: codeberg.org/comaps/maps_generator:f6d53d54f794
      volumes:
        - /mnt/4tbexternal/:/mnt/4tbexternal/
        - /mnt/4tbexternal/osm-planet:/home/planet
    concurrency:
      group: ${{ github.workflow }}-map-generator-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout main repo
        shell: bash
        run: |
          echo "Cloning $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY branch $FORGEJO_REF_NAME"
          cd ~
          git clone --depth 1 --sparse --filter=blob:none -b $FORGEJO_REF_NAME --single-branch $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git comaps
          cd comaps
          git sparse-checkout set tools/unix/maps
      - name: Write config file
        run: |
          mkdir -p ~/.config/rclone/
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
      - name: Upload map files to CDNs
        shell: bash
        run: |
          set -e -u
          shopt -s nullglob
          MAPSDIR="/mnt/4tbexternal/osm-maps"
          SERIES=${NEW_SERIES_VERSION%/*}
          VERSION=${NEW_SERIES_VERSION#*/}
          if ! [[ "$NEW_SERIES_VERSION" =~ ^[0-9.]+/[0-9]+$ ]]; then
            echo "<$(date +%T)> ERROR: new_series_version $NEW_SERIES_VERSION is not in SERIES/VERSION format"
            exit 1
          fi

          # Skips test maps generations like 2026_03_24__09_07_50-test/
          mapsdirs=( $(find $MAPSDIR/ -mindepth 2 -maxdepth 2 -type d -regex ".*/20[0-9_]+/$VERSION$" | sort -r) )
          if (( ${#mapsdirs[@]} != 1 )); then
            echo "<$(date +%T)> ERROR: expected exactly one non-test generation with version $VERSION, found: ${mapsdirs[*]:-none}"
            echo "<$(date +%T)> Found top level: $(ls -alt $MAPSDIR/)"
            exit 1
          fi
          mapspath=${mapsdirs[0]}

          mwmfiles=( $mapspath/*.mwm )
          if (( ! ${#mwmfiles[@]} )); then
            echo "<$(date +%T)> ERROR: No MWM files in $mapspath, not uploading maps."
            exit 1
          fi

          # The app rejects a countries.txt with a bad signature, so don't publish it
          if [[ -f $mapspath/countries.txt ]]; then
            mkdir -p ~/keys
            echo "$COUNTRIES_PUB_KEY" > ~/keys/countries_ed25519_pk.pem
            if ! openssl pkeyutl -verify -pubin -inkey ~/keys/countries_ed25519_pk.pem -rawin -in $mapspath/countries.txt -sigfile $mapspath/countries.txt.sig; then
              echo "<$(date +%T)> ERROR: Failed verifying $mapspath/countries.txt.sig, not uploading maps."
              exit 1
            fi
          fi

          echo "<$(date +%T)> Uploading maps from $mapspath to $NEW_SERIES_VERSION, removing $REMOVE_3 (3-version CDNs) and $REMOVE_6 (6-version CDNs)..."
          cd ~/comaps/tools/unix/maps
          ./upload_to_cdn.sh "$mapspath" "$SERIES" "$REMOVE_3" "$REMOVE_6"
          echo "<$(date +%T)> Finished uploading maps from $mapspath."
      - name: Notify Zulip
        run: |
          curl -X POST https://comaps.zulipchat.com/api/v1/messages \
            -u $ZULIP_BOT_EMAIL:$ZULIP_API_KEY \
            --data-urlencode type=stream \
            --data-urlencode 'to="DevOps"' \
            --data-urlencode topic=codeberg-bot \
            --data-urlencode "content=Maps upload of $NEW_SERIES_VERSION is done! Removed $REMOVE_3 from 3-version CDNs and $REMOVE_6 from 6-version CDNs."
