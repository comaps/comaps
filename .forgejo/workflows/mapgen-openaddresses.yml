name: mapgen-openaddresses
on:
  workflow_dispatch: # Manual trigger
    inputs:
      oa-collection-id:
        description: 'OpenAddresses collection ID (e.g. 6 for Canada)'
        required: true
        default: '6'
        type: string

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
  ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
  OA_API_TOKEN: ${{ secrets.OA_API_TOKEN }}

jobs:
  update-openaddresses:
    name: Update OpenAddresses data
    runs-on: mapfilemaker
    container:
      image: codeberg.org/comaps/maps_generator:f6d53d54f794
      volumes:
        - /mnt/4tbexternal/:/mnt/4tbexternal/
        - /mnt/4tbexternal/osm-planet:/home/planet
    concurrency:
      group: ${{ github.workflow }}-map-generator-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Resolve collection name
        id: resolve
        shell: bash
        run: |
          COLLECTION_ID="${{ inputs.oa-collection-id }}"
          # Do NOT use -L: %{redirect_url} is only populated when curl does not follow the redirect.
          DOWNLOAD_URL=$(curl -fsS \
            -H "Authorization: Bearer ${OA_API_TOKEN}" \
            -w "%{redirect_url}" -o /dev/null \
            "https://batch.openaddresses.io/api/collections/${COLLECTION_ID}/data")
          if [ -z "${DOWNLOAD_URL}" ]; then
            echo "ERROR: could not resolve download URL for collection ${COLLECTION_ID}" >&2
            exit 1
          fi
          # Extract name from URL: https://.../collection-ca.zip -> ca
          COLLECTION_NAME=$(basename "${DOWNLOAD_URL}" | sed 's/^collection-//;s/\.zip$//')
          echo "Collection ${COLLECTION_ID} -> name: ${COLLECTION_NAME}, url: ${DOWNLOAD_URL}"
          echo "collection-name=${COLLECTION_NAME}" >> "$GITHUB_OUTPUT"
          echo "download-url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: Checkout main repo
        shell: bash
        run: |
          echo "Cloning $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY branch $FORGEJO_REF_NAME"
          cd ~
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            -b $FORGEJO_REF_NAME --single-branch \
            $FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git comaps

      - name: Download and preprocess OpenAddresses
        shell: bash
        run: |
          mkdir -p /home/planet/open-addresses/addresses

          export OA_COLLECTION_ID="${{ inputs.oa-collection-id }}"
          export OA_COLLECTION_NAME="${{ steps.resolve.outputs.collection-name }}"
          export OA_API_TOKEN="${OA_API_TOKEN}"
          export COMAPS_DIR="${HOME}/comaps"
          export OA_ZIP_PATH="/home/planet/open-addresses/collection-${OA_COLLECTION_NAME}.zip"
          export OA_OUTPUT_DIR="/home/planet/open-addresses/staging-${OA_COLLECTION_NAME}"

          bash "${COMAPS_DIR}/tools/unix/run_oa_preprocessor.sh"

          DEST_DIR="/home/planet/open-addresses/addresses"
          echo "Copying .tempaddr files to ${DEST_DIR} ..."
          shopt -s nullglob
          for f in "${OA_OUTPUT_DIR}"/*.tempaddr; do
            basename=$(basename "${f}")
            cp "${f}" "${DEST_DIR}/${basename}.tmp" && mv "${DEST_DIR}/${basename}.tmp" "${DEST_DIR}/${basename}"
          done
          echo "DONE"

          curl -X POST https://comaps.zulipchat.com/api/v1/messages \
            -u $ZULIP_BOT_EMAIL:$ZULIP_API_KEY \
            --data-urlencode type=stream \
            --data-urlencode 'to="DevOps"' \
            --data-urlencode topic=codeberg-bot \
            --data-urlencode "content=OpenAddresses preprocessor finished for collection ${OA_COLLECTION_NAME}. Copied to ${DEST_DIR}."
