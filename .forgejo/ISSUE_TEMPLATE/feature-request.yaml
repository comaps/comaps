name: "💡 Feature Request"
description: "Suggest an idea or improvement for CoMaps"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        ⚠ **Have you searched for similar, already existing issues? Please do that before!**
        What would your suggestion solve? Would it benefit most of our users?
        Optional - Describe how we should implement it, for example with pictures as reference.
        Optional - Describe alternatives to your suggestion, for example using another app or a workaround.
