name: "💡 Feature Request"
description: "Suggest an idea or improvement for CoMaps"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        ⚠ **Have you searched for similar, already existing issues?**
                Please do that before submitting a new one ;)
        Please describe your suggestion with a clear and concise description.
        What would your suggestion solve? Would it benefit most of our Users?
        Optional - Describe how we should implement it, for example with Pictures as Refrence
        Optional - Describe Alternatives to your suggestion - Eg. Using another App or using a workarround
