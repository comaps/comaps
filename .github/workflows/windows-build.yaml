      - name: Package portable ZIP (for WinGet)
        shell: pwsh
        run: |
          # A ZIP of the staging directory works as a WinGet portable installer
          # (InstallerType: zip, NestedInstallerType: portable) without requiring
          # a trusted code-signing certificate.
          Compress-Archive -Path staging\* -DestinationPath CoMaps-portable.zip

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoMaps-windows-x64-portable-${{ github.sha }}
          path: CoMaps-portable.zip
          if-no-files-found: error
