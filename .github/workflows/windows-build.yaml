      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION="$version" /DSRCDIR="$PWD" cmake\windows\CoMaps.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoMaps-windows-x64-setup-${{ steps.version.outputs.version }}
          path: CoMaps-windows-x64-setup.exe
          if-no-files-found: error

  upload:
    name: Upload to SFTP
    needs: windows-build
    runs-on: ubuntu-latest
    # Only upload on manual triggers.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check required secrets
        run: |
          missing=()
          [ -z "${{ secrets.SFTP_HOST }}"       ] && missing+=("SFTP_HOST")
          [ -z "${{ secrets.SFTP_USER }}"       ] && missing+=("SFTP_USER")
          [ -z "${{ secrets.SFTP_BASE_PATH }}"  ] && missing+=("SFTP_BASE_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for SFTP upload: ${missing[*]}"
            echo "Set these in GitHub → Settings → Secrets and variables → Actions:"
            for s in "${missing[@]}"; do
              echo "  $s"
            done
            exit 1
          fi
          if [ -z "${{ secrets.SFTP_KEY }}" ] && [ -z "${{ secrets.SFTP_PASSWORD }}" ]; then
            echo "::error::Either SFTP_KEY (private key) or SFTP_PASSWORD must be set."
            exit 1
          fi

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: CoMaps-windows-x64-setup-${{ needs.windows-build.outputs.version }}

      - name: Generate manifest
        run: |
          filename="CoMaps-windows-x64-setup.exe"
          sha256=$(sha256sum "$filename" | awk '{print $1}')
          version="${{ needs.windows-build.outputs.version }}"
          base_url="https://cdn-us-1.comaps.app/windows/${version}"
          echo "SHA256=$sha256" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          # Flat sha256 sidecar
          echo "$sha256  $filename" > "${filename}.sha256"

          # WinGet installer manifest — can be used directly to update winget-pkgs
          cat > CoMaps.CoMaps.installer.yaml <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
          PackageIdentifier: CoMaps.CoMaps
          PackageVersion: ${version}
          InstallerLocale: en-US
          Platform:
            - Windows.Desktop
          MinimumOSVersion: 10.0.0.0
          InstallerType: nullsoft
          UpgradeBehavior: uninstallPrevious
          InstallModes:
            - interactive
            - silent
          InstallerSwitches:
            Silent: /S
            SilentWithProgress: /S
          Dependencies:
            PackageDependencies:
              - PackageIdentifier: Microsoft.VCRedist.2015+.x64
          Installers:
            - Architecture: x64
              InstallerUrl: ${base_url}/${filename}
              InstallerSha256: ${sha256}
          ManifestType: installer
          ManifestVersion: 1.12.0
          EOF
          cat CoMaps.CoMaps.installer.yaml

      - name: Upload manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoMaps-windows-x64-manifest-${{ needs.windows-build.outputs.version }}
          path: |
            CoMaps.CoMaps.installer.yaml
            CoMaps-windows-x64-setup.exe.sha256
          if-no-files-found: error

      - name: Upload to SFTP
        env:
          SFTP_KEY:      ${{ secrets.SFTP_KEY }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          base="${{ secrets.SFTP_BASE_PATH }}"
          remote="${base}/${{ env.VERSION }}"
          filename="CoMaps-windows-x64-setup.exe"

          sftp_cmds=$(mktemp)
          cat > "$sftp_cmds" <<EOF
          -mkdir ${base}
          -mkdir ${remote}
          put ${filename} ${remote}/${filename}
          put ${filename}.sha256 ${remote}/${filename}.sha256
          put CoMaps.CoMaps.installer.yaml ${remote}/CoMaps.CoMaps.installer.yaml
          EOF

          if [ -n "$SFTP_KEY" ]; then
            keyfile=$(mktemp)
            chmod 600 "$keyfile"
            echo "$SFTP_KEY" > "$keyfile"
            sftp -i "$keyfile" \
                 -o StrictHostKeyChecking=accept-new \
                 -o BatchMode=yes \
                 -b "$sftp_cmds" \
                 "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}"
            rm -f "$keyfile"
          else
            sshpass -p "$SFTP_PASSWORD" \
              sftp -o StrictHostKeyChecking=accept-new \
                   -o BatchMode=no \
                   -b "$sftp_cmds" \
                   "${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}"
          fi

          rm -f "$sftp_cmds"
