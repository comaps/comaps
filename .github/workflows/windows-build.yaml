name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &paths
      - 3party/**
      - cmake/**
      - CMakeLists.txt
      - defines.hpp
      - private.h
      - configure.sh
      - libs/**
      - '!libs/platform/*_android*'
      - '!libs/platform/*apple*'
      - '!libs/platform/*_ios*'
      - '!libs/platform/*_linux*'
      - '!libs/platform/*_mac*'
      - qt/**
      - tools/unix/build_omim.bat
      - .github/workflows/windows-build.yaml
  pull_request:
    paths: *paths

jobs:
  windows-build:
    name: Windows x64 MSIX
    runs-on: windows-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs 16

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install optipng and Python protobuf
        run: |
          choco install optipng -y
          pip install "protobuf>=3.20,<4.0"

      - name: Patch kothic for Windows (multiprocessing incompatible with spawn)
        shell: bash
        run: |
          # On Windows the only start method is 'spawn'; worker processes don't inherit
          # globals so pool.imap fails with NameError on variables like 'style'.
          # Disable multiprocessing entirely on Windows (same as the local version of kothic).
          sed -i "s/^MULTIPROCESSING = .*/import sys as _sys; MULTIPROCESSING = _sys.platform != 'win32'/" \
            tools/kothic/src/libkomwm.py
          # Also guard set_start_method in case the line still exists.
          sed -i "s/set_start_method('fork')/if _sys.platform != 'win32': set_start_method('fork')/" \
            tools/kothic/src/libkomwm.py

      - name: Stub uconv (not available on Windows; only needed for Android/iOS strings)
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/uconv" << 'EOF'
          #!/usr/bin/env bash
          # Stub: passes input through without transliteration.
          # uconv is only used by generate_serbian_latin_strings.sh for Android/iOS.
          while [[ $# -gt 0 ]]; do
            case "$1" in
              -x) shift 2 ;;
              *) INPUT="$1"; shift ;;
            esac
          done
          cat "$INPUT"
          EOF
          chmod +x "$HOME/.local/bin/uconv"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure repository
        shell: bash
        env:
          SKIP_MAP_DOWNLOAD: '1'
          PYTHONUTF8: '1'
        run: bash configure.sh

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_UNITY_BUILD=OFF \
            -DUSE_PCH=OFF \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DSKIP_TESTS=ON

      - name: Build CoMaps
        shell: bash
        run: cmake --build build --target desktop --parallel

      - name: Stage executable and Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item build\CoMaps.exe staging\
          windeployqt --release staging\CoMaps.exe
          # windeployqt may miss Qt6Xml which is linked but not detected via import scanning.
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          @("Qt6Xml.dll") | ForEach-Object {
            $src = Join-Path $qtBin $_
            if ((Test-Path $src) -and -not (Test-Path "staging\$_")) {
              Copy-Item $src staging\
            }
          }

      - name: Bundle essential data files
        shell: pwsh
        run: |
          # Copy data/ excluding large map downloads and development-only files.
          # borders/ holds per-country .poly files for the map generator — not needed at runtime
          # (the app uses packed_polygons.bin instead). symbols-svg/ is SVG source, runtime uses
          # the compiled PNGs in symbols/. *.prev and *.diff are development diff artifacts.
          # Robocopy exit codes 0-7 are non-fatal (0=nothing to copy, 1=copied OK, etc.)
          robocopy data staging\data /E `
            /XD world_mwm test_data bookmarks borders symbols-svg 260106 260122 260405 `
            /XF "*.mwm" "*.prev" "*.diff" borders_vs_osm.csv old_vs_new.csv `
                "minsk-pass.osm.bz2" "HOW_TO_EDIT_HIERARCHY.TXT.md"
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }

          # World.mwm and WorldCoasts.mwm are required at runtime for the world overview and
          # coastline rendering. Parse the version code from countries.txt and download from CDN.
          $countries = Get-Content data\countries.txt -Raw | ConvertFrom-Json
          $v          = $countries.v
          $map_series = $countries.map_series
          $base = "https://cdn-fi-1.comaps.app/maps/$map_series/$v"
          Invoke-WebRequest "$base/World.mwm"       -OutFile staging\data\World.mwm
          Invoke-WebRequest "$base/WorldCoasts.mwm" -OutFile staging\data\WorldCoasts.mwm

