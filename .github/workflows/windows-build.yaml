name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    paths: &paths
      - 3party/**
      - cmake/**
      - CMakeLists.txt
      - defines.hpp
      - private.h
      - configure.sh
      - libs/**
      - '!libs/platform/*_android*'
      - '!libs/platform/*apple*'
      - '!libs/platform/*_ios*'
      - '!libs/platform/*_linux*'
      - '!libs/platform/*_mac*'
      - qt/**
      - tools/unix/build_omim.bat
      - tools/unix/build_omim.sh
      - .github/workflows/windows-build.yaml
  pull_request:
    paths: *paths

jobs:
  windows-build:
    name: Windows x64 EXE (ZIP)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs 16

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install optipng, NSIS, and Python protobuf
        run: |
          choco install optipng nsis -y
          pip install "protobuf>=3.20,<4.0"

      - name: Configure repository
        shell: bash
        env:
          PYTHONUTF8: '1'
          SKIP_GENERATE_SERBIAN_LATIN_STRINGS: '1'  # requires uconv (ICU); not available on windows-latest; only affects Android/iOS string files, not the desktop build
        run: bash configure.sh

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_UNITY_BUILD=OFF \
            -DUSE_PCH=OFF \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DSKIP_TESTS=ON

      - name: Build CoMaps
        shell: bash
        run: cmake --build build --target desktop --parallel

      - name: Get version
        id: version
        shell: bash
        run: |
          # Run after configure.sh so the dirty flag matches what was baked into the exe.
          version=$(bash tools/unix/version.sh qt_version | cut -d- -f1-3)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage executable and Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item build\CoMaps.exe staging\
          windeployqt --release staging\CoMaps.exe
          # windeployqt may miss Qt6Xml which is linked but not detected via import scanning.
          $qtBin = Join-Path $env:QT_ROOT_DIR "bin"
          @("Qt6Xml.dll") | ForEach-Object {
            $src = Join-Path $qtBin $_
            if ((Test-Path $src) -and -not (Test-Path "staging\$_")) {
              Copy-Item $src staging\
            }
          }

      - name: Bundle essential data files
        shell: pwsh
        run: |
          # Copy data/ excluding large map downloads and development-only files.
          # borders/ holds per-country .poly files for the map generator — not needed at runtime
          # (the app uses packed_polygons.bin instead). symbols-svg/ is SVG source, runtime uses
          # the compiled PNGs in symbols/. *.prev and *.diff are development diff artifacts.
          # Robocopy exit codes 0-7 are non-fatal (0=nothing to copy, 1=copied OK, etc.)
          robocopy data staging\data /E `
            /XD world_mwm test_data bookmarks borders symbols-svg `
            /XF "*.mwm" "*.prev" "*.diff" borders_vs_osm.csv old_vs_new.csv `
                "minsk-pass.osm.bz2" "HOW_TO_EDIT_HIERARCHY.TXT.md" `
                "drules_proto*.txt"
          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }

          # configure.sh downloaded World/WorldCoasts.mwm into data/world_mwm/<v>/.
          # Copy them as real files (not symlinks) into the staging bundle.
          $v = (Get-Content data\countries.txt -Raw | ConvertFrom-Json).v
          Copy-Item "data\world_mwm\$v\World.mwm"       staging\data\World.mwm
          Copy-Item "data\world_mwm\$v\WorldCoasts.mwm" staging\data\WorldCoasts.mwm
          exit 0

